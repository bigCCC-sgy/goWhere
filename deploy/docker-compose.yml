services:
  mysql:
    image: mysql:8.4
    container_name: gowhere-mysql
    environment:
      MYSQL_DATABASE: gowhere
      MYSQL_USER: gowhere
      MYSQL_PASSWORD: gowhere_dev
      MYSQL_ROOT_PASSWORD: root_dev
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - gowhere_mysql:/var/lib/mysql
      - ../backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  gowhere_mysql:
